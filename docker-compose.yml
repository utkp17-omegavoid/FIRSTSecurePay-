version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: firstsecurepay-db
    environment:
      POSTGRES_DB: firstsecurepay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - firstsecurepay-network

  redis:
    image: redis:7-alpine
    container_name: firstsecurepay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - firstsecurepay-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firstsecurepay-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: firstsecurepay
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: this_is_a_demo_secret_key_change_in_production_32chars
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      FRONTEND_URL: http://localhost:5173
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - firstsecurepay-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firstsecurepay-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    networks:
      - firstsecurepay-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  firstsecurepay-network:
    driver: bridge
